<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Traffic</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      #app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #fff;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 600;
      }

      .controls {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      label {
        font-size: 14px;
        font-weight: 500;
      }

      input[type='text'],
      select {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }

      input[type='text']:focus,
      select:focus {
        outline: none;
        border-color: #0066cc;
        box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
      }

      button {
        padding: 8px 16px;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #0052a3;
      }

      button.secondary {
        background: #666;
      }

      button.secondary:hover {
        background: #555;
      }

      #map {
        flex: 1;
        position: relative;
      }

      .sidebar {
        position: absolute;
        right: 16px;
        top: 80px;
        background: white;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        z-index: 5;
        max-width: 280px;
        max-height: 60vh;
        overflow-y: auto;
      }

      .legend {
        margin-bottom: 16px;
      }

      .legend h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 13px;
      }

      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
      }

      .legend-item input[type='checkbox'] {
        cursor: pointer;
      }

      .status {
        font-size: 12px;
        color: #666;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #eee;
      }

      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
      }

      .status-indicator.connected {
        background: #2ecc71;
      }

      .status-indicator.disconnected {
        background: #e74c3c;
      }

      .event-count {
        margin-top: 8px;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="header">
        <h1>🚗 Live Traffic Data</h1>
        <div class="controls">
          <div class="control-group">
            <label for="type-filter">Event Type:</label>
            <select id="type-filter">
              <option value="">All Types</option>
              <option value="incident">Incidents</option>
              <option value="speed">Speed</option>
              <option value="travel_time">Travel Time</option>
              <option value="road_work">Road Work</option>
              <option value="message_sign">Messages/Signs</option>
            </select>
          </div>
          <button id="load-btn">Load Data</button>
          <button id="subscribe-btn" class="secondary">Subscribe</button>
          <button id="unsubscribe-btn" class="secondary" style="display: none;">Unsubscribe</button>
        </div>
      </div>

      <div id="map"></div>

      <div class="sidebar">
        <div class="legend">
          <h3>Layer Legend</h3>
          <div class="legend-item">
            <input type="checkbox" id="layer-incident" checked />
            <div class="legend-color" style="background: #e74c3c;"></div>
            <label for="layer-incident">Incidents</label>
          </div>
          <div class="legend-item">
            <input type="checkbox" id="layer-speed" checked />
            <div class="legend-color" style="background: #f39c12;"></div>
            <label for="layer-speed">Speed</label>
          </div>
          <div class="legend-item">
            <input type="checkbox" id="layer-travel_time" checked />
            <div class="legend-color" style="background: #3498db;"></div>
            <label for="layer-travel_time">Travel Time</label>
          </div>
          <div class="legend-item">
            <input type="checkbox" id="layer-road_work" checked />
            <div class="legend-color" style="background: #9b59b6;"></div>
            <label for="layer-road_work">Road Work</label>
          </div>
          <div class="legend-item">
            <input type="checkbox" id="layer-message_sign" checked />
            <div class="legend-color" style="background: #1abc9c;"></div>
            <label for="layer-message_sign">Messages</label>
          </div>
        </div>

        <div class="status">
          <div>
            <span class="status-indicator disconnected" id="status-indicator"></span>
            <span id="status-text">Disconnected</span>
          </div>
          <div class="event-count">
            Events: <span id="event-count">0</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
